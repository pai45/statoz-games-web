<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local games</title><style>body{margin:0;background:#0d111a;color:#fff;font:16px system-ui}main{max-width:1000px;padding:32px;margin:auto}a{color:#5cdfff}li{padding:18px;border:1px solid #314158;margin-block:12px}small{color:#90a1b9}h1{font-size:32px}li a:first-child{font-size:22px;display:block;margin-bottom:8px}code{word-break:break-all}</style><main><h1>Local games</h1><p>Device-only play and progress. Choose a game or inspect its recovered asset library.</p><ul id="games"></ul><small>Local reference builds. Original client ownership and conversion provenance are preserved in each game's files. Online matchmaking, provider accounts, ads and payment services are unavailable.</small></main><script>const games=[['stick-cricket','Stick Cricket Chase'],['archery-test','Archery Master'],['tennis-bits','Tennis Bits'],['soccer-real','Soccer REAL'],['f1-racing','Crazy Grand Prix']];for(const[id,name]of games){const li=document.createElement('li'),a=document.createElement('a'),assets=document.createElement('a');a.href='/embedded-games/'+id+'/index.html';a.textContent=name;assets.href='/games/'+id+'/dissection/manifest.json';assets.textContent='Recovered assets and provenance';li.append(a,assets);document.querySelector('#games').append(li)}</script></html>
