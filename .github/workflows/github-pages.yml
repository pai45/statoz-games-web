name: Deploy demo Pages
run-name: ${{ inputs.release_request_id && format('Designer release {0}', inputs.release_request_id) || github.event.head_commit.message || 'Demo build' }}
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed main commit
        required: false
        type: string
      release_request_id:
        description: Designer request ID
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: demo-games_web-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Verify reviewed revision
        env:
          REVIEWED_SHA: ${{ inputs.source_sha }}
        run: |
          if [ -n "$REVIEWED_SHA" ]; then
            [[ "$REVIEWED_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:demo
      - run: npm run build:pages
      - name: Write build identity
        run: |
          python3 - <<'PY'
          import datetime, json, pathlib, subprocess
          manifest = {"schemaVersion": 1, "appId": "games_web", "sourceSha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(), "buildId": "${{ github.run_id }}-${{ github.run_attempt }}", "builtAt": datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z"), "basePath": "/statoz-games-web"}
          pathlib.Path("out/release-manifest.json").write_text(json.dumps(manifest))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: statoz-games_web-static
          path: out
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.event_name != 'pull_request'
        with:
          path: out
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
